[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pptxkit"
version = "0.1.0"
description = "Compile declarative deck specs into branded PowerPoint files — themes, native charts, icons, imagery, animation and QA on python-pptx"
readme = "README.md"
requires-python = ">=3.12"
# The wheel bundles the Material icon set, so the artifact is not MIT-only and its
# metadata must not claim to be. See src/pptxkit/icons/glyphs/material/SOURCE.md.
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "src/pptxkit/icons/glyphs/material/LICENSE"]
authors = [{ name = "Mike Farr" }]
dependencies = [
    # pf-core foundation + the extras this project uses, pinned to a compatible
    # release (picks up patch/minor within the line).
    "pf-core[cli]~=0.21.0",
    "python-pptx>=1.0",  # deck/slide generation + native charts (pulls lxml)
    "markdown>=3.0",     # HTML rendering of doc/figure snippets
    "pillow>=12.0",      # card autocrop, contact sheet, Image.get_flattened_data
    "pyyaml>=6.0",       # deck specs and theme files
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # ruff and mypy are compatible-release pinned so a new minor cannot turn CI
    # red on its own. Same lines pf-core gates on.
    "ruff~=0.16.0",
    "mypy~=2.3.0",
    "types-PyYAML",
    "types-Markdown",
    "lxml-stubs",
    "pre-commit>=3.0",
]

[project.scripts]
pptxkit = "pptxkit.cli:main"

[project.urls]
Repository = "https://github.com/phierceweb/pptxkit"
Issues = "https://github.com/phierceweb/pptxkit/issues"
Changelog = "https://github.com/phierceweb/pptxkit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

# Data, not modules: without this the wheel has no glyphs and no `base` theme, and
# the glyph set's licence has to travel with its files. See docs/icons.md.
[tool.setuptools.package-data]
pptxkit = [
    "py.typed",
    "theme/builtin/*.yaml",
    "icons/glyphs/material/glyphs.zip",
    "icons/glyphs/material/glyphs.sum",
    "icons/glyphs/material/LICENSE",
    "icons/glyphs/material/SOURCE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Type-check config — mypy. Non-strict: annotated code is checked, untyped defs
# are not forced. `files` scopes a bare `mypy` to the same surface CI checks.
[tool.mypy]
python_version = "3.12"
files = ["src"]

# Ruff config mirrors pf-core's conservative set. Layout is enforced separately
# by `ruff format` (bin/lint, pre-commit, CI), which is why E501 stays off.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "B"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
